# Type check (python -m mypy, from the repository root). CI runs it in the
# "lint-and-type" job of .github/workflows/rag-eval.yml.
# Baseline: not strict - checks function bodies and annotated code, ignores
# third-party packages without type hints. Tighten module by module.
[mypy]
python_version = 3.12
mypy_path = backend
files = backend/agents, backend/api, backend/models, backend/utils, backend/workflows, backend/observability,
        backend/vector_store, backend/scripts, backend/security, backend/tools, backend/approvals,
        backend/mcp_server, backend/config.py, backend/app.py
explicit_package_bases = True
ignore_missing_imports = True
check_untyped_defs = True
warn_unused_ignores = True
no_implicit_optional = True
